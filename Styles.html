<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

  html,
  body,
  button,
  input,
  select,
  textarea,
  table,
  th,
  td,
  a,
  p,
  span,
  div,
  label,
  small,
  strong,
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
  }
  :root {
    --bg: #f5f7fb;
    --surface: rgba(255, 255, 255, 0.78);
    --card: #ffffff;
    --text: #111827;
    --muted: #667085;
    --muted-2: #94a3b8;
    --border: #e5e7eb;
    --border-strong: #cbd5e1;
    --primary: #2458ff;
    --primary-hover: #1d4ed8;
    --primary-soft: #edf3ff;
    --success-bg: #ecfdf5;
    --success-text: #047857;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-card: 0 18px 45px rgba(15, 23, 42, 0.08);
    --radius-lg: 18px;A
    --radius-md: 14px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 0% 0%, rgba(36, 88, 255, 0.14), transparent 34%),
      radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.10), transparent 28%),
      var(--bg);
    color: var(--text);
        font-family: font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .app-shell {
    max-width: 1240px;
    margin: 0 auto;
    padding: 30px 18px 28px;
  }

  .app-header {
    margin-bottom: 18px;
  }

  .header-content {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    margin-bottom: 10px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .app-header h1 {
    margin: 0 0 6px;
    font-size: 32px;
    letter-spacing: -0.04em;
    line-height: 1.12;
  }

  .app-header p {
    margin: 0;
    color: var(--muted);
  }

  .version-box {
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-items: flex-end;
  }

  .version-box span {
    display: inline-flex;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.8);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    box-shadow: var(--shadow);
  }

  .app-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    padding: 8px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  .tab-button {
    flex: 1;
    display: flex;
    gap: 11px;
    align-items: center;
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    transition: 0.18s ease;
  }

  .tab-button:hover {
    background: rgba(255, 255, 255, 0.65);
  }

  .tab-button.active {
    background: #ffffff;
    color: var(--primary);
    box-shadow: 0 8px 22px rgba(36, 88, 255, 0.12);
  }

  .tab-icon {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    font-weight: 900;
  }

  .tab-button.active .tab-icon {
    background: var(--primary);
    color: #fff;
  }

  .tab-button strong {
    display: block;
    font-size: 14px;
  }

  .tab-button small {
    display: block;
    font-size: 12px;
    color: var(--muted);
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  .stepper-card {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .stepper {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .step-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px;
    border-radius: 14px;
    color: var(--muted);
  }

  .step-item span {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--muted);
    font-weight: 800;
  }

  .step-item strong {
    display: block;
    font-size: 13px;
    color: inherit;
  }

  .step-item small {
    display: block;
    font-size: 12px;
  }

  .step-item.active {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .step-item.active span {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .step-item.done {
    background: #ecfdf5;
    color: #047857;
  }

  .step-item.done span {
    background: #10b981;
    color: #fff;
    border-color: #10b981;
  }

  .two-columns {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    align-items: start;
    gap: 16px;
  }

  .main-column,
  .side-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-card);
  }

  .sticky-card {
    position: sticky;
    top: 16px;
  }

  .compact-card {
    padding: 18px;
  }

  .card-header {
    margin-bottom: 16px;
  }

  .card-header h2 {
    margin: 0 0 4px;
    font-size: 18px;
    letter-spacing: -0.02em;
  }

  .card-header p {
    margin: 0;
    color: var(--muted);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap: 14px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 800;
  }

  label span {
    color: #dc2626;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 14px;
    outline: none;
    background: #fff;
    color: var(--text);
    transition: 0.15s ease;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(36, 88, 255, 0.11);
  }

  textarea {
    resize: vertical;
    min-height: 96px;
  }

  .hint {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .info-callout,
  .soft-callout {
    margin-bottom: 14px;
    border-radius: 14px;
    padding: 12px 14px;
    color: #334155;
  }

  .info-callout {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
  }

  .soft-callout {
    background: #f8fafc;
    border: 1px solid var(--border);
  }

  .ghost-button,
  .secondary-button {
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--primary);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.16s ease;
  }

  .secondary-button {
    padding: 10px 14px;
    font-size: 13px;
  }

  .ghost-button:hover,
  .secondary-button:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  .pattern-preview-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .pattern-preview {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #f8fafc;
  }

  .pattern-preview h3 {
    margin: 0 0 8px;
    font-size: 13px;
  }

  .badge-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
  }

  .pattern-badge {
    display: inline-flex;
    padding: 4px 7px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border);
    color: #475569;
    font-size: 12px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-badge {
    color: var(--muted);
    font-size: 12px;
  }

  .upload-box {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px dashed #cbd5e1;
    border-radius: 16px;
    padding: 18px;
    background: linear-gradient(180deg, #ffffff, #f8fafc);
    margin-bottom: 14px;
  }

  .upload-box input {
    max-width: 300px;
  }

  .primary-button {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--primary), #4f46e5);
    color: #fff;
    padding: 13px 21px;
    border-radius: 13px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(36, 88, 255, 0.24);
    transition: 0.16s ease;
  }

  .primary-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 30px rgba(36, 88, 255, 0.30);
  }

  .primary-button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .hidden {
    display: none;
  }

  .progress-wrapper {
    width: 100%;
    height: 11px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #2458ff, #60a5fa);
    transition: width 0.25s ease;
  }

  .status-card {
    border-color: #bfdbfe;
  }

  .process-list {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin-top: 14px;
  }

  .process-item {
    padding: 8px 9px;
    border-radius: 11px;
    background: #f8fafc;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  .process-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: #bfdbfe;
    font-weight: 800;
  }

  .process-item.done {
    background: #ecfdf5;
    color: #047857;
    border-color: #bbf7d0;
    font-weight: 800;
  }

  .result-card {
    border-color: #bbf7d0;
    background: linear-gradient(180deg, #f0fdf4, #ffffff);
  }

  .result-card a {
    color: var(--success-text);
    font-weight: 900;
  }

  .open-sheet-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 14px;
    padding: 12px 16px;
    border-radius: 13px;
    background: #047857;
    color: #fff !important;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(4, 120, 87, 0.18);
  }

  .error-card {
    border-color: #fecaca;
    background: var(--error-bg);
  }

  .error-card pre {
    white-space: pre-wrap;
    color: var(--error-text);
    margin: 0;
  }

  .result-meta {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 12px 0;
  }

  .meta-item {
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid rgba(16, 185, 129, 0.25);
    border-radius: 14px;
    padding: 12px;
  }

  .meta-item strong {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: #065f46;
  }

  .meta-item span {
    font-size: 18px;
    font-weight: 900;
    color: #064e3b;
  }

  .warning-list {
    margin: 12px 0 0;
    padding: 12px 14px;
    background: var(--warning-bg);
    color: var(--warning-text);
    border-radius: 14px;
    border: 1px solid #fde68a;
  }

  .warning-list ul {
    margin: 8px 0 0 18px;
    padding: 0;
  }

  .guide-section {
    margin-bottom: 16px;
  }

  .guide-section h3 {
    margin: 0 0 8px;
    font-size: 14px;
  }

  .guide-section ul,
  .output-guide {
    margin: 0;
    padding-left: 18px;
    color: #334155;
  }

  .guide-section li,
  .output-guide li {
    margin: 5px 0;
  }

  .guide-note {
    border-radius: 14px;
    background: var(--warning-bg);
    color: var(--warning-text);
    padding: 12px;
    font-size: 13px;
  }

  .empty-dashboard {
    text-align: center;
    padding: 58px 24px;
    color: var(--muted);
  }

  .empty-dashboard h2 {
    margin: 8px 0 8px;
    color: var(--text);
    font-size: 22px;
  }

  .empty-dashboard p {
    margin: 0 auto 18px;
    max-width: 520px;
  }

  .empty-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 14px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-soft);
    font-size: 30px;
  }

  .dashboard-card {
    border-color: #dbeafe;
  }

  .dashboard-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .dashboard-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .dashboard-kpi {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    background: #fff;
    min-height: 112px;
  }

  .kpi-title {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 25px;
    font-weight: 950;
    letter-spacing: -0.04em;
    color: var(--text);
    margin-bottom: 5px;
  }

  .kpi-subtitle {
    color: var(--muted);
    font-size: 12px;
  }

  .kpi-quality {
    background: #eff6ff;
    border-color: #bfdbfe;
  }

  .kpi-review,
  .kpi-warning {
    background: #fffbeb;
    border-color: #fde68a;
  }

  .kpi-technical {
    background: #fef2f2;
    border-color: #fecaca;
  }

  .kpi-growth,
  .kpi-link,
  .kpi-eligible {
    background: #ecfdf5;
    border-color: #bbf7d0;
  }

  .dashboard-breakdown-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .bar-block {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    background: #fff;
  }

  .bar-block h3,
  .dashboard-section h3 {
    margin: 0 0 12px;
    font-size: 15px;
  }

  .bar-row {
    margin-bottom: 10px;
  }

  .bar-row:last-child {
    margin-bottom: 0;
  }

  .bar-row-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 5px;
    font-size: 13px;
  }

  .bar-label {
    color: #334155;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mini-bar-track {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }

  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2458ff, #60a5fa);
    border-radius: 999px;
  }

  .dashboard-section {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    background: #fff;
    margin-bottom: 16px;
  }

  .warning-dashboard {
    background: var(--warning-bg);
    border-color: #fde68a;
    color: var(--warning-text);
  }

  .warning-dashboard ul {
    margin: 0;
    padding-left: 18px;
  }

  .success-text {
    color: var(--success-text);
    font-weight: 800;
  }

  .dashboard-table-wrapper {
    width: 100%;
    overflow-x: auto;
  }

  .dashboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .dashboard-table th,
  .dashboard-table td {
    border-bottom: 1px solid var(--border);
    padding: 9px 8px;
    text-align: left;
    vertical-align: top;
  }

  .dashboard-table th {
    color: #475569;
    font-size: 12px;
    background: #f8fafc;
    white-space: nowrap;
  }

  .url-cell {
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-footer {
    margin-top: 24px;
    padding: 16px 4px 0;
    border-top: 1px solid rgba(148, 163, 184, 0.25);
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-size: 12px;
  }

  @media (max-width: 1040px) {
    .two-columns {
      grid-template-columns: 1fr;
    }

    .sticky-card {
      position: static;
    }

    .side-column {
      order: -1;
    }

    .dashboard-kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 820px) {
    .header-content {
      flex-direction: column;
    }

    .version-box {
      align-items: flex-start;
    }

    .app-tabs {
      flex-direction: column;
    }

    .stepper {
      grid-template-columns: 1fr 1fr;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .pattern-preview-grid {
      grid-template-columns: 1fr;
    }

    .upload-box {
      align-items: flex-start;
      flex-direction: column;
    }

    .process-list {
      grid-template-columns: 1fr;
    }

    .result-meta {
      grid-template-columns: 1fr 1fr;
    }

    .dashboard-breakdown-grid {
      grid-template-columns: 1fr;
    }

    .app-footer {
      flex-direction: column;
    }
  }

  @media (max-width: 520px) {
    .result-meta,
    .dashboard-kpi-grid {
      grid-template-columns: 1fr;
    }

    .stepper {
      grid-template-columns: 1fr;
    }
  }
    .history-card {
    border-color: #dbeafe;
  }

  .history-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .history-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .danger-button {
    border: 1px solid #fecaca;
    background: #fff;
    color: #b91c1c;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.16s ease;
  }

  .danger-button:hover {
    background: #fef2f2;
  }

  .history-loading,
  .history-error,
  .empty-history {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #f8fafc;
    color: var(--muted);
  }

  .history-error {
    background: var(--error-bg);
    color: var(--error-text);
    border-color: #fecaca;
  }

  .empty-history {
    text-align: center;
  }

  .empty-history h3 {
    margin: 8px 0 6px;
    color: var(--text);
  }

  .empty-history p {
    margin: 0;
  }

  .empty-icon.small {
    width: 54px;
    height: 54px;
    border-radius: 18px;
    margin: 0 auto 10px;
    font-size: 24px;
  }

  .history-summary {
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
  }

  .history-table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
  }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .history-table th,
  .history-table td {
    padding: 12px 10px;
